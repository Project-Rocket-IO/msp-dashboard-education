{% load file_extension  %}

<div class="col-xl-4 col-sm-6">
  <div class="card shadow-none border">
    <div class="card-body p-3">
      <div class="">
        <div class="float-end ms-2">
          <div class="dropdown mb-2">
            <a
              class="font-size-16 text-muted"
              role="button"
              data-bs-toggle="dropdown"
              aria-haspopup="true"
            >
              <i class="mdi mdi-dots-horizontal"></i>
            </a>

            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" href="#">Open</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" href="#">Remove</a>
            </div>
          </div>
        </div>
        <div class="avatar-xs me-3 mb-3">
          <div class="avatar-title bg-transparent rounded">
            <i class="bx bxs-folder font-size-24 text-warning"></i>
          </div>
        </div>
        <div class="d-flex">
          <div class="overflow-hidden me-auto">
            <h5 class="font-size-14 text-truncate mb-1">
              <a
                href="{% url 'apps:filemanager.detail' directory.path|encoded_path %}"
                class="text-body"
                >{{directory.name}}</a
              >
            </h5>
            <p class="text-muted text-truncate mb-0">{{file_count}} Files</p>
          </div>
          <div class="align-self-end ms-2">
            <p class="text-muted mb-0">{{directory.space}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- end col -->


{% comment %} 
{% if directory.directories %}
    <div class="row">
        {% for subdirectory in directory.directories %}
            {% render_directory subdirectory %}
        {% endfor %}
    </div>
{% endif %} {% endcomment %}
